{% extends "admin/change_list.html" %}

{% block object-tools %}
<style>
    .object-tools ul li a.download-btn:hover {
        background: #218838 !important;
    }
    
    #loading-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 10000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        backdrop-filter: blur(5px);
    }

    .loader {
        border: 5px solid #f3f3f3;
        border-top: 5px solid #28a745;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
    }

    .loading-text {
        text-align: center;
    }

    .loading-text h2 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        animation: pulse 2s infinite ease-in-out;
    }

    .loading-text p {
        margin-top: 10px;
        opacity: 0.8;
        font-size: 1rem;
        min-height: 1.2em;
    }

    .progress-container {
        width: 300px;
        height: 10px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 5px;
        margin-top: 20px;
        overflow: hidden;
        display: none;
    }

    .progress-bar {
        height: 100%;
        background: #28a745;
        width: 0%;
        transition: width 0.3s ease;
    }
</style>

<div id="loading-overlay">
    <div class="loader"></div>
    <div class="loading-text">
        <h2 id="loading-title">Processing...</h2>
        <p id="loading-desc">Please stay on this page until finished.</p>
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>
</div>


<div class="object-tools">
    <ul>
        <li>
            <a href="upload/">Upload Hansard PDF</a>
        </li>
        <li>
            <a href="fetch-web/" class="download-btn" id="fetch-web-btn" style="background: #28a745; color: white;">Download from Web</a>
        </li>
    </ul>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const fetchBtn = document.getElementById('fetch-web-btn');
        const overlay = document.getElementById('loading-overlay');
        const title = document.getElementById('loading-title');
        const desc = document.getElementById('loading-desc');
        const progContainer = document.getElementById('progress-container');
        const progBar = document.getElementById('progress-bar');
        
        let pollingInterval = null;

        function startPolling() {
            if (pollingInterval) return;
            
            pollingInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/pipeline-status/');
                    const data = await response.json();
                    
                    if (data.message && data.message !== 'Idle') {
                        desc.innerText = data.message;
                        
                        if (data.current && data.total) {
                            const percent = (data.current / data.total) * 100;
                            progContainer.style.display = 'block';
                            progBar.style.width = percent + '%';
                        }
                    }
                } catch (error) {
                    console.error('Error polling status:', error);
                }
            }, 2000);
        }

        // Trigger for "Download from Web" button
        if (fetchBtn) {
            fetchBtn.addEventListener('click', function(e) {
                title.innerText = 'Fetching Hansards from Web';
                desc.innerHTML = 'Connecting to parliament.gh...';
                overlay.style.display = 'flex';
                startPolling();
            });
        }

        // Trigger for admin actions (Run Pipeline)
        const changelistForm = document.getElementById('changelist-form');
        if (changelistForm) {
            changelistForm.addEventListener('submit', function(e) {
                const actionSelect = document.querySelector('select[name="action"]');
                if (actionSelect && actionSelect.value === 'run_pipeline_action') {
                    title.innerText = 'Running Hansard Pipeline';
                    desc.innerHTML = 'Initializing...';
                    overlay.style.display = 'flex';
                    startPolling();
                }
            });
        }
    });
</script>


{% endblock %}
